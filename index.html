<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界大富翁（連線版）</title>
<style>
:root{--bg:#f6f6f2;--fg:#222;--panel:#fff;--line:#b9b7ae;--bd:#d6d4cc;--accent:#ff9f1a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1f;--fg:#ececec;--panel:#26282c;--line:#555a63;--bd:#3b3e44;--accent:#ffb347}}
:root[data-theme="dark"]{--bg:#1b1c1f;--fg:#ececec;--panel:#26282c;--line:#555a63;--bd:#3b3e44;--accent:#ffb347}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:10px;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans TC",sans-serif}
h1{font-size:18px;margin:2px 0 8px}
.wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.board{flex:1 1 560px;min-width:0}
svg{width:100%;height:auto;display:block}
.side{flex:1 1 300px;min-width:280px}
.box{background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.pl{border-left:6px solid;}
.pl.on{outline:2px solid var(--fg)}
button,select{font:inherit;padding:6px 12px;margin:2px;cursor:pointer;border-radius:6px;border:1px solid var(--bd);background:var(--panel);color:var(--fg)}
button.big{background:var(--accent);color:#222;border:0;font-weight:700;font-size:16px;padding:9px 18px}
button:disabled{opacity:.45;cursor:default}
.dice{font-size:32px;font-weight:700}
.hint{color:var(--accent);font-weight:700}
#log{font-size:12px;max-height:150px;overflow:auto;line-height:1.6}
@media (min-width:0){.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}}
.cg{max-width:460px}.cd.can{cursor:pointer;outline:2px solid var(--accent)}.cd.can:hover{filter:brightness(1.15)}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px;background:var(--bd);font-size:12px}
.cd.on{color:#fff;font-weight:700}.cd small{font-size:9px;font-weight:400}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:3px 4px;text-align:center;border-bottom:1px solid var(--bd)}td:first-child,th:first-child{text-align:left}
input[type=number]{width:56px;font:inherit;padding:4px;border-radius:6px;border:1px solid var(--bd);background:var(--panel);color:var(--fg)}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.md .box{max-width:420px;width:100%;max-height:85vh;overflow:auto;margin:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.pulse{animation:p 1s infinite}@keyframes p{50%{opacity:.55}}

.wait [onclick],.wait input,.wait select{pointer-events:none}
/* 右上角按鈕、棋子動畫、提示 */
.topbar{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.topbar #st{flex:1 1 220px;margin:0}
#tb{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
#tb button{margin:0;padding:5px 10px;font-size:13px}
button.danger{border-color:#d33;color:#d33;font-weight:700}
.tok{transition:transform .24s linear;pointer-events:none}
.tk{transition:transform .2s ease-out}.tk.me{transform:scale(1.35)}
@media (prefers-reduced-motion:reduce){.tok,.tk{transition:none}}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:9;font-size:14px;max-width:90vw;text-align:center}
#lobby{max-width:460px}.seat{padding:6px 10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--panel)}
.code{font-size:34px;font-weight:700;letter-spacing:6px}
input[type=text]{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--bd);background:var(--panel);color:var(--fg)}
</style></head><body>
<h1>世界大富翁（連線版）</h1>
<div id="lobby"></div>
<div id="game" style="display:none"><div class="topbar"><div id="st" class="box"></div><div id="tb"></div></div><div id="md"></div>
<div class="wrap"><div class="board" id="bd"></div><div class="side" id="sd"></div></div></div>
<div id="vt"></div>
<script src="/map.js"></script><script src="/engine.js"></script><script src="/online.js"></script>
</body></html>
